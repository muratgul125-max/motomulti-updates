<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Göz Animasyon Testi</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--fg:#e8ecf4;--mute:#8a93a6;--acc:#7fb4ff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0d0f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:520px;margin:auto}
h1{font-size:18px;margin:0 0 12px}
.dev{background:#22252c;border-radius:22px;padding:18px;box-shadow:inset 0 0 0 2px #333842}
canvas{width:100%;aspect-ratio:128/68;background:#000;border-radius:8px;image-rendering:pixelated;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{flex:1 1 30%;padding:12px 6px;border:0;border-radius:10px;background:var(--panel);color:var(--fg);font-size:14px}
button.on{background:var(--acc);color:#000}
#gyro{flex:1 1 60%;background:#2b4a7a}
.info{margin-top:12px;font:12px monospace;color:var(--mute);white-space:pre-wrap}
button.sw{flex:0 0 36px;height:36px;padding:0;border-radius:50%;border:2px solid #333842}
button.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.cn{margin-top:6px;font-size:13px;color:var(--mute)}
label{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<h1>Göz Animasyon Testi · 128×68</h1>
<div class="dev"><canvas id="c" width="128" height="68"></canvas></div>
<div class="row"><button id="gyro">Gyro'yu Etkinleştir</button><button id="center" style="flex:0 0 30%">Ortala</button></div>
<div class="row" id="colors"></div><div class="cn">OLED rengi: <b id="colname"></b></div>
<div class="row" id="moods"></div>
<label><input type="checkbox" id="auto" checked> Hareketle otomatik ifade (hafif vuruş → şaşkın, sallama → kızgın, hızlı döndürme → sersem, ekranı yere çevirme → bayılma, 15 sn hareketsiz → uyku)</label>
<div class="info" id="info">Gyro kapalı — ekranı sürükleyerek eğimi simüle edebilirsin.</div>
<script>
// ================= EKRAN =================
const c=document.getElementById('c'),out=c.getContext('2d');
const W=128,H=68;
const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
const img=out.createImageData(W,H);
// piyasadaki tek renkli OLED panel renkleri
const COLORS={
 'Beyaz':['#eef4ff'],'Mavi':['#38a8ff'],'Sarı':['#ffd83a'],'Yeşil':['#3dff86'],
 'Turuncu':['#ffa21f'],'Kırmızı':['#ff3d3d'],'Mor':['#b46bff'],'Turkuaz':['#2ff0e6'],
 'Sarı+Mavi (çift)':['#ffd83a','#38a8ff'],
};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
let colName='Beyaz';try{const v=localStorage.getItem('oledColor');if(COLORS[v])colName=v}catch(e){}
function present(){const d=x.getImageData(0,0,W,H).data,q=img.data,cs=COLORS[colName].map(hex);
 for(let i=0;i<d.length;i+=4){const row=(i>>2)/W|0;const col=cs.length>1&&row>=16?cs[1]:cs[0];
  const on=d[i]>110;q[i]=on?col[0]:0;q[i+1]=on?col[1]:0;q[i+2]=on?col[2]:0;q[i+3]=255}
 out.putImageData(img,0,0)}
{const row=document.getElementById('colors');for(const k in COLORS){const b=document.createElement('button');
 b.className='sw';b.title=k;const cs=COLORS[k];
 b.style.background=cs.length>1?`linear-gradient(${cs[0]} 0 24%,${cs[1]} 24%)`:cs[0];
 b.onclick=()=>{colName=k;try{localStorage.setItem('oledColor',k)}catch(e){};mark()};row.appendChild(b)}
 function mark(){[...row.children].forEach(b=>b.classList.toggle('on',b.title===colName));document.getElementById('colname').textContent=colName}
 mark()}
const PI=Math.PI,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);

// ================= İFADELER (kaomoji / piksel tarzı) =================
const MOODS={normal:'Normal',happy:'Mutlu',wink:'Göz kırp',sad:'Üzgün',angry:'Kızgın',surprise:'Şaşkın',sleep:'Uyku',love:'Aşık',dizzy:'Sersem',faint:'Bayıldı'};
function line(pts,w=3){x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke()}
function dot(rx,ry){x.beginPath();x.ellipse(0,0,rx,ry,0,0,2*PI);x.fill()}
function hole(a,b,r){x.fillStyle='#000';x.beginPath();x.arc(a,b,r,0,2*PI);x.fill();x.fillStyle='#fff'}
const EYE={
 normal:(s,t,px,py)=>{dot(6,8)},
 happy:()=>{x.lineWidth=3.5;x.lineCap='round';x.beginPath();x.arc(0,5,9,PI*1.15,PI*1.85);x.stroke()},
 wink:(s,t,px,py)=>{if(s<0){dot(6,8)}else line([[7,-7],[-6,0],[7,7]],3.5)},
 sad:(s,t,px,py)=>{dot(6,7);line([[-s*8,-14],[s*8,-10]],2.2)},
 angry:(s)=>{dot(9,8);x.fillStyle='#000';x.beginPath();x.moveTo(-s*14,-14);x.lineTo(-s*14,2);x.lineTo(s*14,-9);x.lineTo(s*14,-14);x.fill();x.fillStyle='#fff'},
 surprise:(s,t,px,py)=>{dot(8,11)},
 sleep:()=>{x.lineWidth=3;x.lineCap='round';x.beginPath();x.arc(0,-5,8,PI*0.15,PI*0.85);x.stroke()},
 love:(s,t)=>{const k=1+Math.max(0,Math.sin(t/160))**8*0.25;x.scale(k,k);x.beginPath();x.moveTo(0,8);x.bezierCurveTo(-13,-1,-7,-11,0,-4);x.bezierCurveTo(7,-11,13,-1,0,8);x.fill()},
 dizzy:(s,t)=>{x.lineWidth=2;x.lineCap='round';x.beginPath();const a=t/120*s;for(let u=0;u<15;u+=0.2)x.lineTo(Math.cos(u+a)*u*0.65,Math.sin(u+a)*u*0.65);x.stroke()},
 faint:()=>{line([[-6,-6],[6,6]],3.5);line([[6,-6],[-6,6]],3.5)},
};
const MOUTH={
 normal:()=>{x.lineWidth=2.5;x.lineCap='round';x.beginPath();x.arc(0,-4,5,PI*0.2,PI*0.8);x.stroke()},
 happy:()=>{x.lineWidth=2.5;x.lineCap='round';x.beginPath();x.arc(0,-5,7,PI*0.2,PI*0.8);x.stroke()},
 wink:()=>{x.beginPath();x.moveTo(-6,-2);x.lineTo(6,-2);x.arc(0,-2,6,0,PI);x.fill()},
 sad:()=>{x.lineWidth=2.5;x.lineCap='round';x.beginPath();x.arc(0,5,6,PI*1.2,PI*1.8);x.stroke()},
 angry:()=>line([[-5,1],[5,1]],2.5),
 surprise:(t)=>{x.lineWidth=2.5;x.beginPath();x.ellipse(0,0,3,3.5+Math.sin(t/150)*0.6,0,0,2*PI);x.stroke()},
 sleep:()=>{x.lineWidth=2;x.lineCap='round';x.beginPath();x.arc(0,3,3,PI*1.15,PI*1.85);x.stroke()},
 love:()=>{x.beginPath();x.moveTo(-6,-2);x.lineTo(6,-2);x.arc(0,-2,6,0,PI);x.fill()},
 dizzy:(t)=>{x.lineWidth=2;x.lineCap='round';x.beginPath();for(let i=-7;i<=7;i++)x.lineTo(i,Math.sin(i*0.9+t/90)*1.5);x.stroke()},
 faint:()=>{x.lineWidth=2;x.lineCap='round';x.beginPath();for(let i=-6;i<=6;i++)x.lineTo(i,(i&1)?1:-1);x.stroke()},
};
const BLUSH={happy:1,wink:1,love:1};
const NOBLINK={sleep:1,dizzy:1,faint:1,love:1};
function blush(cx,cy){x.lineWidth=1.6;x.lineCap='round';x.beginPath();for(let i=0;i<3;i++){x.moveTo(cx+i*4-4,cy+2);x.lineTo(cx+i*4-2,cy-1)}x.stroke()}

// ================= DURUM =================
let mood='normal',pending=null,manual='normal',moodUntil=0,pop=0;
const auto=()=>document.getElementById('auto').checked;
const mb=document.getElementById('moods');
for(const k in MOODS){const b=document.createElement('button');b.textContent=MOODS[k];b.dataset.k=k;
 b.onclick=()=>{manual=k;moodUntil=0;setMood(k)};mb.appendChild(b)}
const target=()=>pending||mood;
function sync(){const t=target();[...mb.children].forEach(b=>b.classList.toggle('on',b.dataset.k===t))}
function setMood(m){if(m===target())return;pending=m;startBlink(performance.now(),false);sync()}
function trigger(m,ms){if(!auto())return;if(target()!==m)setMood(m);moodUntil=performance.now()+ms}
sync();

// bakış: yay (spring) fiziği -> hafif gecikme ve doğal oturma
const gaze={x:0,y:0,vx:0,vy:0};
let tiltX=0,tiltY=0,moving=0;            // sensörden gelen, filtrelenmiş eğim
let sacX=0,sacY=0,sacUntil=0,nextSac=performance.now()+1500;
let drift={x:0,y:0};
// göz kırpma
let blinkT=-1e9,dbl=false,nextBlink=performance.now()+2500;
function startBlink(now,double){blinkT=now;dbl=double;nextBlink=now+rnd(2500,6500)}
function blinkAmt(now){const t=now-blinkT;let b=0;
 if(t<60)b=t/60;else if(t<90)b=1;else if(t<200)b=1-(t-90)/110;
 else if(dbl&&t<280)b=0;else if(dbl&&t<480){const u=t-280;b=u<55?u/55:u<80?1:Math.max(0,1-(u-80)/110)}
 return b*b*(3-2*b)}

// ================= ANA DÖNGÜ =================
let last=performance.now(),lastActive=performance.now(),idle=false,tapAt=0;
function frame(now){
 const dt=Math.min(50,now-last)/16.67;last=now;
 if(moodUntil&&now>moodUntil){moodUntil=0;setMood(manual)}
 if(auto()){
  if(faceDown){if(target()!=='faint')setMood('faint');moodUntil=now+4000;lastActive=now}
  else if(!idle&&now-lastActive>15000&&target()!=='sleep'){idle=true;setMood('sleep');moodUntil=0}
  if(tapAt&&now-tapAt>280){if(shakePeaks.length<2)trigger('surprise',3500);tapAt=0}
 }
 const asleep=mood==='sleep';
 // --- kendiliğinden bakış (telefon sabitken) ---
 moving*=Math.pow(0.9,dt);
 if(now>nextSac&&!asleep){
  if(moving<0.15){
   const r=Math.random();
   if(r<0.35){sacX=0;sacY=0}                                   // merkeze dön
   else if(r<0.85){sacX=rnd(-0.75,0.75);sacY=rnd(-0.45,0.35)}  // etrafa bak
   else{sacX=rnd(-0.5,0.5);sacY=-0.6}                          // yukarı, düşünür gibi
   if(Math.hypot(sacX-gaze.x,sacY-gaze.y)>0.6&&Math.random()<0.5)startBlink(now,false); // büyük bakışta kırp
  }else{sacX=0;sacY=0}
  nextSac=now+rnd(900,3200)}
 // mikro titreşim (fiksasyon kayması)
 drift.x+=(rnd(-1,1)*0.02-drift.x*0.05)*dt;drift.y+=(rnd(-1,1)*0.02-drift.y*0.05)*dt;
 const gx=asleep?0:clamp(tiltX+sacX*(1-Math.min(1,Math.abs(tiltX)*1.5))+drift.x,-1,1);
 const gy=asleep?0:clamp(tiltY+sacY*(1-Math.min(1,Math.abs(tiltY)*1.5))+drift.y,-1,1);
 const K=0.22,D=0.62;                  // yay sertliği / sönüm
 gaze.vx=(gaze.vx+(gx-gaze.x)*K*dt)*Math.pow(D,dt);gaze.vy=(gaze.vy+(gy-gaze.y)*K*dt)*Math.pow(D,dt);
 gaze.x+=gaze.vx*dt;gaze.y+=gaze.vy*dt;
 // --- göz kırpma ---
 if(now>nextBlink&&!NOBLINK[mood]&&!pending)startBlink(now,Math.random()<0.18);
 const b=blinkAmt(now);
 if(pending&&now-blinkT>=75){mood=pending;pending=null;pop=1;sync()}
 pop*=Math.pow(0.85,dt);
 const open=NOBLINK[mood]&&!pending?1:1-b;
 // --- çiz ---
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.strokeStyle='#fff';
 const breathe=Math.sin(now/(asleep?1500:1000))*(asleep?1.4:0.5);
 const ox=gaze.x*9,oy=gaze.y*5+breathe,sc=1+pop*0.12;
 for(const s of[-1,1]){
  const persp=1+gaze.x*s*0.08;
  x.save();x.translate(64+s*28+ox,27+oy);x.scale(1.4*sc*persp,1.4*sc*persp*Math.max(0.1,open));
  EYE[mood](s,now,gaze.x*1.2,gaze.y*1.2);x.restore();
 }
 if(BLUSH[mood]){blush(64-40+ox,45+oy);blush(64+40+ox,45+oy)}
 x.save();x.translate(64+ox*0.75,52+oy*0.85);x.scale(sc,sc);MOUTH[mood](now);x.restore();
 if(asleep){const t=(now/1800)%1;x.font='bold 8px monospace';x.fillText('z',94,20-t*5);if(t>0.35)x.fillText('Z',101,12-t*5)}
 present();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ================= SENSÖRLER =================
const info=document.getElementById('info');
let nOri=0,nMot=0,base=null,rawG=0,rawB=0,faceDown=false,downSince=0;
let grav={x:0,y:0,z:9.8},shakePeaks=[],lastPeakSign=0,spinMs=0,lastMot=0,rotMag=0,linMag=0;
function wake(now){lastActive=now;if(idle){idle=false;trigger('surprise',3000)}}
function applyTilt(g,bt){
 rawG=g;rawB=bt;if(!base)base={g,b:bt};
 let nx=clamp((g-base.g)/28,-1,1),ny=clamp((bt-base.b)/28,-1,1);
 const dz=v=>Math.abs(v)<0.08?0:(v-Math.sign(v)*0.08)/0.92;   // ölü bölge: titremeyi keser
 nx=dz(nx);ny=dz(ny);
 const ch=Math.abs(nx-tiltX)+Math.abs(ny-tiltY);moving=Math.min(1,moving+ch*3);
 tiltX+=(nx-tiltX)*0.25;tiltY+=(ny-tiltY)*0.25;               // alçak geçiren filtre
}
document.getElementById('center').onclick=()=>{base={g:rawG,b:rawB}};
function onOri(e){nOri++;if(e.beta==null)return;applyTilt(e.gamma||0,e.beta||0)}
function onMot(e){
 nMot++;const now=performance.now(),a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
 const dtm=lastMot?Math.min(100,now-lastMot):16;lastMot=now;
 // yerçekimi tahmini (alçak geçiren) ve doğrusal ivme
 grav.x+=(a.x-grav.x)*0.1;grav.y+=(a.y-grav.y)*0.1;grav.z+=(a.z-grav.z)*0.1;
 const la=e.acceleration&&e.acceleration.x!=null?e.acceleration:{x:a.x-grav.x,y:a.y-grav.y,z:a.z-grav.z};
 linMag=Math.hypot(la.x,la.y,la.z);
 const r=e.rotationRate;rotMag=r?Math.hypot(r.alpha||0,r.beta||0,r.gamma||0):0;
 if(!nOri||!base&&nOri===0){const g=Math.atan2(-grav.x,Math.hypot(grav.y,grav.z))*180/PI,bt=Math.atan2(grav.y,grav.z)*180/PI;if(!nOri)applyTilt(g,bt)}
 if(linMag>1.2||rotMag>45)wake(now);
 // ters çevirme: ekran 0,6 sn boyunca aşağı bakıyor
 if(grav.z<-7){if(!downSince)downSince=now;faceDown=now-downSince>600}else{downSince=0;faceDown=false}
 // döndürme: 350 ms boyunca hızlı dönüş
 spinMs=rotMag>220?spinMs+dtm:Math.max(0,spinMs-dtm*2);
 if(spinMs>350){trigger('dizzy',6000);spinMs=0}
 // sallama: 1 sn içinde yön değiştiren 4+ güçlü tepe
 const ax=Math.abs(la.x)>Math.abs(la.y)?la.x:la.y;
 shakePeaks=shakePeaks.filter(t=>now-t<1000);
 if(Math.abs(ax)>9&&Math.sign(ax)!==lastPeakSign){lastPeakSign=Math.sign(ax);shakePeaks.push(now)}
 if(shakePeaks.length>=4){trigger('angry',5000);shakePeaks=[];tapAt=0}
 // vuruş: kısa ani darbe, ardından sallama yok
 if(linMag>7&&!tapAt&&rotMag<150&&shakePeaks.length<=1)tapAt=now;
 // darbe gözleri hafifçe sarsar
 if(linMag>4){gaze.vx-=la.x*0.006;gaze.vy+=la.y*0.006}
 info.textContent=`olay: yön ${nOri} / hareket ${nMot}\neğim x ${tiltX.toFixed(2)}  y ${tiltY.toFixed(2)}\nivme ${linMag.toFixed(1)} m/s²  dönüş ${rotMag.toFixed(0)}°/s  sallama ${shakePeaks.length}\nmod: ${mood}${faceDown?'  (ters)':''}`;
}
document.getElementById('gyro').onclick=async function(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
   if(await DeviceOrientationEvent.requestPermission()!=='granted')throw 'izin reddedildi';
   if(DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();
  }
  addEventListener('deviceorientation',onOri);addEventListener('devicemotion',onMot);
  base=null;this.textContent='Gyro aktif ✓ (tuttuğun açı = merkez)';this.classList.add('on');
  setTimeout(()=>{if(!nOri&&!nMot)info.textContent='Sensör verisi gelmiyor. Chrome: kilit simgesi → Site ayarları → Hareket sensörleri → İzin ver, sonra yenile.'},2000);
 }catch(err){info.textContent='Gyro açılamadı: '+err}
};
// sürükleyerek simülasyon
c.addEventListener('pointermove',e=>{if(!e.buttons&&e.pointerType==='mouse')return;const r=c.getBoundingClientRect();
 tiltX=((e.clientX-r.left)/r.width)*2-1;tiltY=((e.clientY-r.top)/r.height)*2-1;moving=1;lastActive=performance.now()});
c.addEventListener('pointerup',()=>{tiltX=tiltY=0});
</script>
</body>
</html>
